name: Build iOS12 Compose

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Show versions
        run: |
          xcodebuild -version
          ./gradlew --version

      - name: Build Compose UI framework for iOS (correct path)
        run: |
          ./gradlew :compose:ui:ui:linkDebugFrameworkIosArm64 --stacktrace 2>&1 | tee compose-ui-build.log
        continue-on-error: true

      - name: Build XCFramework for iOS (correct path)
        run: |
          ./gradlew :compose:ui:ui:assembleDebugXCFramework --stacktrace 2>&1 | tee xcframework-build.log
        continue-on-error: true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            compose-ui-build.log
            xcframework-build.log