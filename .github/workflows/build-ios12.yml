name: Build iOS12 Compose

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Compose UI framework (device arm64)
        run: |
          ./gradlew :compose:ui:ui:linkDebugFrameworkIosArm64 --stacktrace 2>&1 | tee compose-ui-build.log
        continue-on-error: true

      - name: Locate built framework
        if: always()
        run: |
          echo "=== Searching for any .framework directory ==="
          find . -name "*.framework" -type d 2>/dev/null | head -20
          echo "=== Expected module path ==="
          ls -la compose/ui/ui/build/bin/iosArm64/debugFramework/ 2>/dev/null || echo "Path not found"

      - name: Upload framework
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-ui-framework
          path: |
            compose/ui/ui/build/bin/iosArm64/debugFramework/**/*.framework/**
            compose/ui/ui/build/bin/iosArm64/debugFramework/*.framework
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: compose-ui-build.log
