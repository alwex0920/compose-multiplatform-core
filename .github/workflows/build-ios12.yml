name: Build iOS12 Compose

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Publish iOS-12 patched Compose to Maven Local
        env:
          COMPOSE_CUSTOM_VERSION: 1.0.0-ios12
        run: |
          ./gradlew \
            :compose:runtime:runtime:publishToMavenLocal \
            :compose:runtime:runtime-saveable:publishToMavenLocal \
            :compose:ui:ui:publishToMavenLocal \
            :compose:ui:ui-geometry:publishToMavenLocal \
            :compose:ui:ui-graphics:publishToMavenLocal \
            :compose:ui:ui-text:publishToMavenLocal \
            :compose:ui:ui-unit:publishToMavenLocal \
            :compose:ui:ui-util:publishToMavenLocal \
            :compose:foundation:foundation:publishToMavenLocal \
            :compose:foundation:foundation-layout:publishToMavenLocal \
            :compose:material:material:publishToMavenLocal \
            :compose:material3:material3:publishToMavenLocal \
            :compose:animation:animation:publishToMavenLocal \
            --stacktrace 2>&1 | tee publish.log

      - name: Show published artifacts
        if: always()
        run: |
          echo "=== .m2/repository/org/jetbrains/compose ==="
          ls -la ~/.m2/repository/org/jetbrains/compose/ 2>/dev/null || echo "not found"
          echo "=== Search for ios12 klibs ==="
          find ~/.m2/repository -name "*1.0.0-ios12*" 2>/dev/null | head -30

      - name: Pack Maven repo
        if: always()
        run: |
          tar -czf m2-ios12.tar.gz -C ~/.m2/repository .

      - name: Upload Maven repo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-ios12-repo
          path: m2-ios12.tar.gz
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-logs
          path: publish.log
