name: Build iOS12 Compose
on:
  push:
    branches: ['**']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - run: xcodebuild -version && ./gradlew --version
      - run: ./gradlew :skiko:linkDebugFrameworkIosArm64 --stacktrace 2>&1 | tee skiko-build.log
        continue-on-error: true
      - run: ./gradlew :compose:ui:linkDebugFrameworkIosArm64 --stacktrace 2>&1 | tee compose-ui-build.log
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            skiko-build.log
            compose-ui-build.log
