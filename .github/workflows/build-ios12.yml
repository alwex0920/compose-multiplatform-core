name: Build iOS12 Compose

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Show versions
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          ./gradlew --version

      - name: Build Compose UI framework for iOS (arm64 device)
        run: |
          ./gradlew :compose:ui:ui:linkDebugFrameworkIosArm64 --stacktrace 2>&1 | tee compose-ui-build.log
        continue-on-error: true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: compose-ui-build.log